<div class="page">
  <section class="brand">
    <div class="bubbles" aria-hidden="true">
      <span class="bubble b1"></span>
      <span class="bubble b2"></span>
      <span class="bubble b3"></span>
      <span class="bubble b4"></span>
      <span class="bubble b5"></span>
      <span class="bubble b6"></span>
      <span class="bubble b7"></span>
    </div>
    <div class="brand-content">
      <div class="logo-backdrop">
        <img src="/images/Fluw.png" alt="Flow" class="logo" />
      </div>
      <p class="tagline">Organiza tus ingresos y gastos de forma fácil y clara.</p>
    </div>
  </section>

  <section class="panel">
    <div class="card">
      <header class="card-header">
        <h2>Tu sesión ha caducado</h2>
        <p>Por seguridad, tu sesión terminó porque alcanzó el tiempo máximo permitido.</p>
      </header>
      <button type="button" (click)="goToLogin()">Iniciar sesión nuevamente</button>
    </div>
  </section>
</div>
